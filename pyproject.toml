[project]
name = "stackoverflow-vitality-observatory"
version = "0.1.0"
description = "Local-first, reproducible analysis of Stack Overflow vitality and AI-era signals."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.scripts]
stackoverflow-vitality = "stackoverflow_vitality.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackoverflow_vitality"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "stubs"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
